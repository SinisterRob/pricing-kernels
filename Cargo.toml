[package]
name = "pricing-kernels"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
authors = ["Robert Jurgens, FCAS <robertdjurgens@gmail.com>"]
description = "Pure Rust numeric kernels for P&C actuarial pricing and underwriting-risk capital modeling."
license = "MIT OR Apache-2.0"
repository = "https://github.com/SinisterRob/pricing-kernels"
homepage = "https://sinisterrob.github.io"
documentation = "https://docs.rs/pricing-kernels"
readme = "README.md"
exclude = [
    ".github/",
    ".githooks/",
    ".gitignore",
    ".gitattributes",
]
keywords = ["actuarial", "pricing", "reinsurance", "experience-rating", "glm"]
categories = ["mathematics", "science", "simulation"]

publish = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pricing_kernels"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Single-threaded C-ABI exports for wasm32 browser builds (not for concurrent native use).
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "pricing_bench"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

imprecise_flops = "warn"
lossy_float_literal = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
derive_partial_eq_without_eq = "warn"

suboptimal_flops = "allow"
unreadable_literal = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
float_cmp = "allow"
module_name_repetitions = "allow"
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_long_first_doc_paragraph = "allow"
