name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, forbid unsafe_code)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (library panic/unwrap/expect-free gate)
        run: cargo clippy --lib --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --all-targets --no-default-features
      - name: Test (all features)
        run: cargo test --all-targets --all-features
      - name: Doctests
        run: cargo test --doc --all-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.97
      - name: Check library, tests, and benchmarks (default features)
        run: cargo check --lib --tests --benches --no-default-features
      - name: Check library, tests, and benchmarks (all features)
        run: cargo check --lib --tests --benches --all-features
      - name: Unit tests on MSRV
        run: cargo test --lib

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs with warnings denied
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm32 release binary
        run: cargo build --release --target wasm32-unknown-unknown --features wasm
      - name: Smoke-test WASM C-ABI exports
        run: node scripts/wasm-smoke.mjs target/wasm32-unknown-unknown/release/pricing_kernels.wasm

  security:
    name: Security & Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
      - name: Lint hooks and shell scripts
        run: shellcheck .githooks/* scripts/*.sh
      - name: Syntax-check Node scripts
        run: |
          shopt -s nullglob
          for js in scripts/*.mjs scripts/*.js; do
            node --check "$js"
          done

  benchmarks:
    name: Bench Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check release benchmarks compile
        run: cargo check --benches --release

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [fmt, clippy, test, msrv, docs, wasm, security, benchmarks]
    steps:
      - name: Verify all required CI jobs succeeded
        shell: bash
        env:
          RESULTS: >-
            fmt=${{ needs.fmt.result }}
            clippy=${{ needs.clippy.result }}
            test=${{ needs.test.result }}
            msrv=${{ needs.msrv.result }}
            docs=${{ needs.docs.result }}
            wasm=${{ needs.wasm.result }}
            security=${{ needs.security.result }}
            benchmarks=${{ needs.benchmarks.result }}
        run: |
          failed=0
          for item in $RESULTS; do
            echo "$item"
            if [[ "$item" != *=success ]]; then
              failed=1
            fi
          done
          exit "$failed"
